<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мини-Мессенджер</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f0f2f5; }
        #chat { width: 100%; max-width: 500px; height: 300px; border: 1px solid #ccc; background: white; overflow-y: scroll; padding: 10px; margin-bottom: 10px; border-radius: 8px; }
        input { width: 75%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 20%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Бесплатный Онлайн Чат</h2>
    <div id="chat"></div>
    <input type="text" id="messageInput" placeholder="Введите сообщение..." autofocus>
    <button onclick="sendMessage()">Отправить</button>

    <script>
        // Умное определение адреса: если открыто на хостинге, берет его wss:// домен
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const host = window.location.host || 'localhost:8000';
        const ws = new WebSocket(`${protocol}//${host}/ws/chat`);

        const chatDiv = document.getElementById('chat');
        const messageInput = document.getElementById('messageInput');

        // Получение сообщения от сервера
        ws.onmessage = function(event) {
            const message = document.createElement('p');
            message.textContent = event.data;
            chatDiv.appendChild(message);
            chatDiv.scrollTop = chatDiv.scrollHeight; // Скролл вниз
        };

        // Отправка сообщения на сервер
        function sendMessage() {
            if (messageInput.value.trim() !== '') {
                ws.send(messageInput.value);
                messageInput.value = '';
            }
        }

        // Отправка по нажатию Enter
        messageInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
